[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-home-energy"
version = "0.1.0"
description = "Local home energy monitoring and approval-controlled washer agent"
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2.1,<3",
    "python-dotenv>=1,<2",
    "streamlit>=1.37,<2",
    "openai==2.54.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
calendar = ["pdfplumber>=0.11,<1"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[tool.setuptools.package-data]
smart_home_energy = ["data/*.json"]
